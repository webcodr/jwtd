[settings]
# Record checksums in mise.lock so the release toolchain is pinned by bytes,
# not only by version. Without it, a retagged or replaced upstream artifact
# would install silently.
lockfile = true

[tools]
go = "1.27.0"
goreleaser = "2.18.0"
cosign = "3.1.3"
syft = "1.51.0"
"go:golang.org/x/tools/gopls" = "0.23.0"
