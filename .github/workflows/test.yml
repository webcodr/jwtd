name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.4.0

      - name: Check website JavaScript syntax
        run: node --check site/script.js

      - name: Run website JavaScript tests
        run: node --test site/script.test.js

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Check GoReleaser configuration
        run: goreleaser check

      # Keyless signing needs an OIDC identity that pull requests from forks
      # cannot obtain, and snapshots are never published, so signing is skipped
      # here. The release workflow exercises the signing path.
      - name: Build GoReleaser snapshot
        run: goreleaser release --snapshot --clean --skip=sign

      - name: Verify GoReleaser artifact contract
        run: |
          # tar.gz archives carry a Syft SBOM each; the windows zips (for WinGet)
          # wrap the same binary as the windows tar.gz, so they are deliberately
          # not SBOM'd separately.
          expected_tarballs=(
            "jwtd-linux-amd64.tar.gz"
            "jwtd-linux-arm64.tar.gz"
            "jwtd-darwin-amd64.tar.gz"
            "jwtd-darwin-arm64.tar.gz"
            "jwtd-windows-amd64.tar.gz"
            "jwtd-windows-arm64.tar.gz"
          )

          expected_archives=(
            "${expected_tarballs[@]}"
            "jwtd-windows-amd64.zip"
            "jwtd-windows-arm64.zip"
          )

          actual_archives=$(jq -r '[.[] | select(.type == "Archive") | .name] | sort | .[]' dist/artifacts.json)
          expected_sorted=$(printf '%s\n' "${expected_archives[@]}" | sort)
          if [ "$actual_archives" != "$expected_sorted" ]; then
            echo "Unexpected archive set in dist/artifacts.json:" >&2
            echo "$actual_archives" >&2
            exit 1
          fi

          checksum_names=$(jq -r '[.[] | select(.type == "Checksum") | .name] | .[]' dist/artifacts.json)
          if [ "$checksum_names" != "checksums.txt" ]; then
            echo "Expected exactly one checksums.txt Checksum artifact, got:" >&2
            echo "$checksum_names" >&2
            exit 1
          fi

          expected_sboms=()
          for archive in "${expected_tarballs[@]}"; do
            expected_sboms+=("$archive.sbom.json")
          done
          actual_sboms=$(jq -r '[.[] | select(.type == "SBOM") | .name] | sort | .[]' dist/artifacts.json)
          expected_sboms_sorted=$(printf '%s\n' "${expected_sboms[@]}" | sort)
          if [ "$actual_sboms" != "$expected_sboms_sorted" ]; then
            echo "Unexpected SBOM set in dist/artifacts.json:" >&2
            echo "$actual_sboms" >&2
            exit 1
          fi

          expected_packages=(
            "jwtd-linux-amd64.deb"
            "jwtd-linux-arm64.deb"
            "jwtd-linux-amd64.rpm"
            "jwtd-linux-arm64.rpm"
          )
          actual_packages=$(jq -r '[.[] | select(.type == "Linux Package") | .name] | sort | .[]' dist/artifacts.json)
          expected_packages_sorted=$(printf '%s\n' "${expected_packages[@]}" | sort)
          if [ "$actual_packages" != "$expected_packages_sorted" ]; then
            echo "Unexpected Linux package set in dist/artifacts.json:" >&2
            echo "$actual_packages" >&2
            exit 1
          fi

          scoop_names=$(jq -r '[.[] | select(.type == "Scoop Manifest") | .name] | .[]' dist/artifacts.json)
          if [ "$scoop_names" != "jwtd.json" ]; then
            echo "Expected exactly one jwtd.json Scoop Manifest artifact, got:" >&2
            echo "$scoop_names" >&2
            exit 1
          fi

          # checksums.txt must cover the reproducible artifacts only: the
          # archives and the Linux packages. Including the non-reproducible
          # SBOMs would make the signed checksum file differ on every run and
          # break byte-for-byte release verification.
          checksummed=$(cut -c 67- dist/checksums.txt | sort)
          expected_checksummed=$(printf '%s\n' "${expected_archives[@]}" "${expected_packages[@]}" | sort)
          if [ "$checksummed" != "$expected_checksummed" ]; then
            echo "checksums.txt must cover exactly the archives and Linux packages, got:" >&2
            echo "$checksummed" >&2
            exit 1
          fi

          for archive in "${expected_archives[@]}"; do
            case "$archive" in
              *windows*) expected_entry="jwtd.exe" ;;
              *) expected_entry="jwtd" ;;
            esac
            case "$archive" in
              *.zip) entries=$(unzip -Z1 "dist/$archive") ;;
              *) entries=$(tar -tzf "dist/$archive") ;;
            esac
            if [ "$entries" != "$expected_entry" ]; then
              echo "Archive $archive must contain only $expected_entry, got:" >&2
              echo "$entries" >&2
              exit 1
            fi
          done

          (cd dist && sha256sum --check checksums.txt)

  # install_test.go can only assert the shape of install.ps1; the behaviour it
  # guards - archive naming, checksum verification, replacing a running binary,
  # and the user PATH edit - needs a real Windows host. This job installs the
  # latest published release the way a user would.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { $_.ToString() }
            exit 1
          }

      - name: Install the latest release
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'jwtd-install'
          ./install.ps1 -Dir $dir -NoModifyPath
          & (Join-Path $dir 'jwtd.exe') --version

      # The second run exercises the upgrade path: Windows cannot overwrite an
      # existing .exe in place, so the installer renames it aside first and must
      # clean up after itself.
      - name: Reinstall over the existing binary
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'jwtd-install'
          ./install.ps1 -Dir $dir -NoModifyPath
          $token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6Imp3dGQifQ.JbLj7QQhCqlNvT-EOwJSeB4ArXQPoXlhBGhWSGD7-V4'
          & (Join-Path $dir 'jwtd.exe') --json $token
          $leftovers = @(Get-ChildItem -Path $dir -Force | Where-Object { $_.Name -ne 'jwtd.exe' })
          if ($leftovers.Count -ne 0) {
            "the installer left files behind: $($leftovers.Name -join ', ')"
            exit 1
          }

      - name: Write nothing when the release cannot be fetched
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'jwtd-unavailable'
          $failed = $false
          try { ./install.ps1 -Dir $dir -NoModifyPath -Version v0.0.0-does-not-exist }
          catch { $failed = $true }
          if (-not $failed) { 'the installer must fail on an unavailable release'; exit 1 }
          if (Test-Path (Join-Path $dir 'jwtd.exe')) {
            'the installer must not write a binary when verification cannot pass'
            exit 1
          }

      - name: Add to the user PATH without rewriting existing entries
        shell: pwsh
        run: |
          $key = 'HKCU:\Environment'
          $original = (Get-Item $key).GetValue(
            'Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          try {
            Set-ItemProperty -Path $key -Name 'Path' `
              -Value '%USERPROFILE%\seeded;C:\already\there' -Type ExpandString
            $dir = Join-Path $env:RUNNER_TEMP 'jwtd-path'
            ./install.ps1 -Dir $dir

            $raw = (Get-Item $key).GetValue(
              'Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $entries = @($raw -split ';' | Where-Object { $_ -ne '' })
            # The seeded entry must survive verbatim: an installer that expands
            # it would bake this runner's profile path into the user's PATH.
            if ($entries[0] -ne '%USERPROFILE%\seeded') {
              "unexpanded PATH entry was rewritten: $raw"
              exit 1
            }
            if ($entries -notcontains $dir) {
              "install directory missing from PATH: $raw"
              exit 1
            }
            if ((Get-Item $key).GetValueKind('Path') -ne 'ExpandString') {
              'PATH must stay a REG_EXPAND_SZ value'
              exit 1
            }
          } finally {
            Set-ItemProperty -Path $key -Name 'Path' -Value $original -Type ExpandString
          }

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds the current-system package from source, so a stale vendorHash
      # (or any other flake regression) fails here instead of silently rotting;
      # --all-systems additionally evaluates the darwin/arm outputs.
      - name: Check flake
        run: nix flake check --all-systems --print-build-logs
